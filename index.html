<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="Justin Abate's projects, including a simple five-day workout tracker.">
  <title>Justin Abate</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f8fa; color: #1f2937; font-family: system-ui, sans-serif; line-height: 1.6; }
    main { max-width: 640px; margin: 0 auto; padding: clamp(48px, 12vh, 120px) 20px; }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.2; }
    .intro { color: #667085; margin: 12px 0 32px; }
    article { padding: 24px; background: #fff; border: 1px solid #d6d9de; border-radius: 16px; }
    h2 { margin: 0; font-size: 1.35rem; }
    article p { margin: 10px 0 20px; }
    a { display: inline-block; padding: 12px 18px; border-radius: 10px; background: #155eef; color: #fff; font-weight: 600; text-decoration: none; }
    a:hover { background: #104bc4; }
    a:focus-visible { outline: 3px solid #155eef; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Justin Abate</h1>
    <p class="intro">A home for my projects.</p>
    <article aria-labelledby="workout-title">
      <h2 id="workout-title">Workout Tracker</h2>
      <p>A five-day resistance training plan with exercise guides, set tracking, and a rest timer. Save your progress as you go.</p>
      <a href="https://justinabate.github.io/workout-tracker/">Open workout tracker &rarr;</a>
    </article>
  </main>
</body>
</html>
